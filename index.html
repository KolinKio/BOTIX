        '<div class="off">🔌 <b>Сервер отключён</b><br><span style="font-size:11.5px">Слот #'+s.id+' · '+s.dt+' GB NVMe</span></div>'+
        '<div class="cf"><span class="mono">slot #'+(s.id<10?"0":"")+s.id+'</span><span>inactive</span></div></div>';
    }
    var u=Math.round(d.dt*d.disk/100);
    return '<div class="card ok" style="--ac:'+s.c+';'+dl+'">'+
      '<div class="ch"><div class="cn"><span>'+s.f+'</span>'+s.n+'</div>'+
      '<div class="bg bg-on"><span class="dot" style="width:6px;height:6px;flex:0 0 6px"></span>online</div></div>'+
      '<div class="cs">'+s.l+'</div>'+
      '<canvas data-id="'+s.id+'"></canvas>'+
      '<div class="kp">'+
        '<div class="k"><i>📡 Пинг</i><b id="p'+s.id+'" style="color:'+pc(d.ping)+'">'+d.ping+'<small>ms</small></b></div>'+
        '<div class="k"><i>〰️ Задержка</i><b id="j'+s.id+'">'+d.jit+'<small>ms</small></b></div>'+
        '<div class="k"><i>⬇️ Download</i><b id="d'+s.id+'">'+d.dn+'<small>Mb/s</small></b></div>'+
        '<div class="k"><i>⬆️ Upload</i><b id="u'+s.id+'">'+d.up+'<small>Mb/s</small></b></div>'+
      '</div>'+
      '<div class="bars">'+
        '<div><div class="bt"><i>💾 Диск</i><span id="dt'+s.id+'">'+u+' / '+d.dt+' GB · '+d.disk+'%</span></div>'+
        '<div class="tr"><div class="fl '+bc(d.disk)+'" id="db'+s.id+'" style="width:'+d.disk+'%"></div></div></div>'+
        '<div><div class="bt"><i>🧠 CPU</i><span id="ct'+s.id+'">'+d.cpu+'%</span></div>'+
        '<div class="tr"><div class="fl '+bc(d.cpu)+'" id="cb'+s.id+'" style="width:'+d.cpu+'%"></div></div></div>'+
        '<div><div class="bt"><i>📦 RAM</i><span id="rt'+s.id+'">'+d.ram+'%</span></div>'+
        '<div class="tr"><div class="fl '+bc(d.ram)+'" id="rb'+s.id+'" style="width:'+d.ram+'%"></div></div></div>'+
      '</div>'+
      '<div class="cf"><span class="mono">slot #'+(s.id<10?"0":"")+s.id+'</span><span class="mono">up '+d.upt+'%</span></div></div>';
  }).join("");
  redraw();
}
function redraw(){var cs=document.querySelectorAll("canvas[data-id]");for(var i=0;i<cs.length;i++){var id=+cs[i].getAttribute("data-id");for(var j=0;j<SRV.length;j++)if(SRV[j].id===id)chart(cs[i],SRV[j]);}}
function set(id,v){var e=$(id);if(e)e.innerHTML=v;}
function bar(id,v){var e=$(id);if(e){e.style.width=v+"%";e.className="fl "+bc(v);}}
function totals(){
  var on=SRV.filter(function(s){return D[s.id].on;}),c=on.length,ps=0,us=0,spd=0;
  on.forEach(function(s){ps+=D[s.id].ping;us+=D[s.id].upt;});
  SRV.forEach(function(s){spd+=D[s.id].dn+D[s.id].up;});
  var p=c?Math.round(ps/c):0;
  $("kOn").innerHTML=c+'<small>/'+SRV.length+'</small>';
  $("kOnS").textContent=c===SRV.length?"все активны":(SRV.length-c)+" offline";
  $("kPing").innerHTML=p+'<small> ms</small>';
  $("kPingS").textContent=p<80?"отличное соединение":(p<150?"стабильное":"повышенная задержка");
  $("kSpd").innerHTML=(spd/1000).toFixed(2)+'<small> Gb/s</small>';
  $("kUp").innerHTML=(c?(us/c).toFixed(2):"0.00")+'<small>%</small>';
}
function tick(){
  SRV.forEach(function(s){
    var d=D[s.id];if(!d.on)return;
    var p=d.h[d.h.length-1];p=p+(d.base-p)*0.17+gs()*4;
    if(Math.random()<0.022)d.sp=ri(25,95);if(d.sp>0){p+=d.sp;d.sp=Math.floor(d.sp*0.45);}
    p=cl(p,d.base*0.62,d.base*3.6);d.h.push(+p.toFixed(1));d.h.shift();d.ping=Math.round(p);
    d.jit=+cl(d.jit+gs()*0.35,0.6,9).toFixed(1);d.dn=Math.round(cl(d.dn+gs()*22,180,950));
    d.up=Math.round(cl(d.up+gs()*16,90,720));d.disk=+cl(d.disk+rf(-0.12,0.16),5,99).toFixed(1);
    d.cpu=Math.round(cl(d.cpu+gs()*4.5,3,96));d.ram=Math.round(cl(d.ram+gs()*2.8,10,94));
    var pe=$("p"+s.id);if(pe){pe.innerHTML=d.ping+'<small>ms</small>';pe.style.color=pc(d.ping);}
    set("j"+s.id,d.jit+'<small>ms</small>');set("d"+s.id,d.dn+'<small>Mb/s</small>');set("u"+s.id,d.up+'<small>Mb/s</small>');
    set("dt"+s.id,Math.round(d.dt*d.disk/100)+" / "+d.dt+" GB · "+d.disk+"%");set("ct"+s.id,d.cpu+"%");set("rt"+s.id,d.ram+"%");
    bar("db"+s.id,d.disk);bar("cb"+s.id,d.cpu);bar("rb"+s.id,d.ram);
  });
  redraw();totals();
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;tab=b.getAttribute("data-k");mkTabs();render();});
$("q").addEventListener("input",function(e){q=e.target.value.toLowerCase().trim();render();});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(redraw,120);});
window.addEventListener("orientationchange",function(){setTimeout(redraw,320);});
mkTabs();render();totals();setInterval(tick,2000);
})();
</script>
</body>
</html>
